<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次使用 · 选择卡片风格</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#edf0f3;color:#182129;font:16px/1.6 system-ui,sans-serif;padding:24px}header,main{max-width:1320px;margin:auto}h1{margin:0;font-size:28px}p{color:#53616a;margin:8px 0 18px}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}.comparison{width:100%;max-height:79vh;object-fit:contain;object-position:top;background:white}aside{background:white;border:1px solid #d6dfe5;border-radius:12px;padding:22px}h2{font-size:19px;margin:0 0 14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:flex;gap:8px;align-items:center;border:1px solid #cbd4dc;border-radius:6px;padding:12px 8px;cursor:pointer;font-size:14px}.choice:has(input:checked){border:2px solid #002fa7;background:#edf2ff}.choice input{accent-color:#002fa7}label.field{display:block;margin-top:18px}input[type=text]{display:block;width:100%;padding:10px;border:1px solid #bbc7cf;border-radius:5px;font:inherit}button{width:100%;border:0;border-radius:6px;background:#002fa7;color:white;font:700 17px system-ui;padding:14px;margin-top:22px;cursor:pointer}button:disabled{background:#a5afb8;cursor:default}small{color:#66747d}#message{white-space:pre-wrap;margin:16px 0 0}#message.error{color:#b52715}#message.success{color:#12734d}@media(max-width:850px){body{padding:16px}main{grid-template-columns:1fr}.comparison{max-height:none}aside{width:100%}}</style><body><header><h1>首次使用 · 选择你的卡片风格</h1><p>先选择视频或图文，再选择卡片风格。只需首次选择，以后随时可以更换。视频和自动封面使用同一套风格。</p></header><main><img id="comparison" class="comparison" src="comparison.jpg" alt="卡片风格对比，按输出形式展示精选风格"><aside><h2>请选择一种风格</h2><form id="form"><div class="choices" id="choices"></div><label class="field">输出形式<select id="output-mode" style="display:block;width:100%;padding:10px;font:inherit"><option value="video">口播视频</option><option value="notes">小红书图文 直接导出图片</option></select></label><label class="field" id="audio-field">配音方式<select id="audio-source" style="display:block;width:100%;padding:10px;font:inherit"><option value="recorded">上传配音 不安装VoiceStudio</option><option value="clone">只发文案 使用本人声音克隆</option></select></label><label class="field">账号名或品牌 <small>可稍后设置</small><input type="text" id="brand" maxlength="24" placeholder="例如 校长运营笔记"></label><label class="field">右上角栏目 <small>可留空</small><input type="text" id="tagline" maxlength="24" placeholder="例如 门店经营"></label><p><small>已去掉默认的 FIG 和幕编号。图文无需配音和头像；视频可在下一步配置。</small></p><button id="save" disabled>选好后保存并继续</button><div id="message" role="status"></div></form></aside></main><script>
function toggleOutput(){byId('audio-field').hidden=byId('output-mode').value==='notes'}
let selected=null,allStyles={};const byId=id=>document.getElementById(id);const message=(text,kind='')=>{byId('message').textContent=text;byId('message').className=kind};
function renderChoices(preferred=null){const mode=byId('output-mode').value;byId('choices').replaceChildren();selected=null;byId('save').disabled=true;let items=Object.entries(allStyles).filter(([key,value])=>mode==='notes'?value.notes_featured:(value.modes||['notes','video']).includes('video'));if(preferred&&allStyles[preferred]&&!items.some(([key])=>key===preferred)&&(allStyles[preferred].modes||['notes','video']).includes(mode))items.push([preferred,{...allStyles[preferred],name:allStyles[preferred].name+'（当前旧风格）'}]);items.forEach(([key,value],i)=>{const label=document.createElement('label');label.className='choice';const radio=document.createElement('input');radio.type='radio';radio.name='theme';radio.value=key;radio.addEventListener('change',()=>{selected=key;byId('save').disabled=false});label.append(radio,document.createTextNode(`${i+1} ${value.name}`));byId('choices').append(label);if(preferred===key){radio.checked=true;selected=key}});byId('comparison').src=mode==='notes'?'notes-comparison.jpg':'comparison.jpg';byId('comparison').alt=mode==='notes'?'六种图文风格对比':'十种视频风格对比';if(selected)byId('save').disabled=false;toggleOutput()}
async function start(){const [styles,state]=await Promise.all([fetch('styles').then(r=>r.json()),fetch('state').then(r=>r.json())]);allStyles=styles;byId('brand').value=state.header?.brand||'';byId('tagline').value=state.header?.tagline||'';byId('audio-source').value=state.audio_source||'recorded';byId('output-mode').value=state.output_mode||'video';renderChoices(state.theme||null)}
byId('output-mode').addEventListener('change',()=>renderChoices());
byId('form').addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;byId('save').disabled=true;try{const header={tagline:byId('tagline').value.trim()};if(byId('brand').value.trim())header.brand=byId('brand').value.trim();const r=await fetch('save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:selected,header,audio_source:byId('audio-source').value,output_mode:byId('output-mode').value})});const result=await r.json();if(!r.ok)throw Error(result.error||'保存失败');message('已保存默认风格。\n请返回 WorkBuddy 或安装窗口，继续制作内容。这个页面可以关闭。','success');byId('save').textContent='初始化完成';}catch(e){message(e.message,'error');byId('save').disabled=false}});start().catch(e=>message('未能加载选择项，请返回安装窗口重新运行初始化。'+e.message,'error'));
</script></body></html>
